name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ShellCheck on bin/
        run: |
          find bin/ -name '*.sh' -print0 | xargs -0 shellcheck \
            --severity=warning \
            --exclude=SC1090,SC1091,SC2034,SC2148

      - name: Run ShellCheck on install.sh and uninstall.sh
        run: shellcheck --severity=warning --exclude=SC1090,SC1091,SC2034,SC2148 install.sh uninstall.sh

  python-syntax:
    name: Python Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.x"

      - name: Check Python syntax
        run: |
          python -m py_compile bin/lib/templates/templates.py
          python -m py_compile bin/lib/config/config_manager.py
          python -m py_compile bin/lib/utils/yaml_parser.py
          python -m py_compile scripts/validate_stacks.py
          python -m py_compile scripts/validate_service_names.py
          python -m py_compile scripts/generate_stack_settings.py

  validate-examples:
    name: Validate Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate example profiles
        run: |
          python scripts/validate_stacks.py --profiles-dir examples/profiles
          python scripts/validate_service_names.py --profiles-dir examples/profiles

  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.x"

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML files
        run: |
          yamllint -d '{extends: relaxed, rules: {line-length: disable, truthy: disable}}' \
            examples/ .swarmcli.yaml.example

  bash-tests:
    name: Bash Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.x"

      - name: Install bats-core
        run: |
          sudo npm install -g bats
          for lib in bats-support bats-assert bats-file; do
            sudo git clone --depth 1 "https://github.com/bats-core/${lib}.git" "/usr/local/lib/${lib}"
          done

      - name: Install Python dependencies
        run: pip install pyyaml jinja2 markupsafe

      - name: Run Bash unit tests
        run: bats tests/bash/ --recursive

      - name: Run integration tests
        run: bats tests/integration/ --recursive

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install pyyaml jinja2 markupsafe pytest pytest-cov

      - name: Run Python tests
        run: python -m pytest tests/python/ -v --tb=short
